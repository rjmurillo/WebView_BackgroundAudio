name: verify-windows

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --version
          msbuild -version -nologo
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -property displayName
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.ComponentGroup.UWP.Support -property installationPath

      - name: Build Release x64
        run: msbuild BackgroundAudio/BackgroundAudio.csproj /restore /p:Configuration=Release /p:Platform=x64 /v:minimal /nologo

      - name: Inspect component winmd
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter BackgroundAudioWinRT.winmd | ForEach-Object { $_.FullName }
          $winmd = Get-ChildItem -Recurse -Filter BackgroundAudioWinRT.winmd | Select-Object -First 1
          $stream = [System.IO.File]::OpenRead($winmd.FullName)
          $pe = [System.Reflection.PortableExecutable.PEReader]::new($stream)
          $md = [System.Reflection.Metadata.PEReaderExtensions]::GetMetadataReader($pe)
          foreach ($h in $md.TypeDefinitions) {
            $t = $md.GetTypeDefinition($h)
            $name = $md.GetString($t.Namespace) + "." + $md.GetString($t.Name)
            foreach ($ah in $t.GetCustomAttributes()) {
              $a = $md.GetCustomAttribute($ah)
              if ($a.Constructor.Kind -eq [System.Reflection.Metadata.HandleKind]::MemberReference) {
                $mr = $md.GetMemberReference([System.Reflection.Metadata.MemberReferenceHandle]$a.Constructor)
                if ($mr.Parent.Kind -eq [System.Reflection.Metadata.HandleKind]::TypeReference) {
                  $tr = $md.GetTypeReference([System.Reflection.Metadata.TypeReferenceHandle]$mr.Parent)
                  Write-Output ("{0} has [{1}.{2}]" -f $name, $md.GetString($tr.Namespace), $md.GetString($tr.Name))
                }
              }
            }
          }
          $pe.Dispose()

      - name: Inspect app output
        shell: pwsh
        run: |
          Get-ChildItem BackgroundAudio/bin -Recurse -Include *.winmd,AppxManifest.xml,BackgroundAudio.exe,BackgroundAudio.dll,BackgroundAudioWinRT.dll | ForEach-Object { $_.FullName }
          $m = Get-ChildItem BackgroundAudio/bin -Recurse -Filter AppxManifest.xml | Select-Object -First 1
          if ($m) { Get-Content $m.FullName }

      - name: Package MSIX Release x64
        run: msbuild BackgroundAudio/BackgroundAudio.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never /p:AppxPackageSigningEnabled=false /v:minimal /nologo

      - name: Inspect MSIX package
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Get-ChildItem BackgroundAudio -Recurse -Filter *.appxrecipe | ForEach-Object { $_.FullName; Select-String -Path $_.FullName -Pattern 'winmd|WinRT.Host' | ForEach-Object { $_.Line.Trim() } }
          $pkgs = Get-ChildItem BackgroundAudio -Recurse -Include *.msix,*.appx
          foreach ($p in $pkgs) {
            Write-Output ("PACKAGE {0} {1} bytes" -f $p.FullName, $p.Length)
            $zip = [System.IO.Compression.ZipFile]::OpenRead($p.FullName)
            $zip.Entries | ForEach-Object { $_.FullName } | Where-Object { $_ -notmatch '^Assets/' }
            $zip.Dispose()
            $sig = Get-AuthenticodeSignature $p.FullName
            Write-Output ("SIGNATURE {0} {1}" -f $sig.Status, $sig.SignerCertificate.Subject)
          }
